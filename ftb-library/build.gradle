plugins { id 'java-library'; id 'com.cleanroommc.cleanroomgradle' }
group = 'com.feed_the_beast.mods'
version = '5.5.4-modern.8'
base.archivesName = 'FTB-Library-NovaEng'
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://maven.cleanroommc.com' }; flatDir { dirs rootProject.file('.build-deps') } }
apply from: '../ftb-quests/dependency-lock.gradle'

dependencies {
    implementation cleanroom.userdev(cleanroom_version) { accessTransformers.from('src/main/resources/META-INF/ftblib_at.cfg') }
    ftbLockedDependencies.each { compileOnly deobf([name: ftbDependencyName(it)]) }
    // Legacy icon export API is optional at runtime (ClientUtils.hasJavaFX).
    compileOnly 'org.openjfx:javafx-graphics:17.0.2:linux'
    compileOnly 'org.openjfx:javafx-base:17.0.2:linux'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
def generatedTags = layout.buildDirectory.dir('generated/sources/tags')
tasks.register('generateTags') {
    inputs.property('version', project.version)
    outputs.dir(generatedTags)
    doLast {
        def out = generatedTags.get().file('com/feed_the_beast/ftblib/Tags.java').asFile
        out.parentFile.mkdirs()
        out.text = 'package com.feed_the_beast.ftblib; public final class Tags { public static final String VERSION = "' + project.version + '"; }'
    }
}
sourceSets.main.java.srcDir(generatedTags)
compileJava.dependsOn('generateTags')
tasks.named('sourcesJar') { dependsOn('generateTags') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(net.minecraftforge.renamer.gradle.RenameJar).configureEach {
    javaLauncher.set(javaToolchains.launcherFor { spec -> spec.languageVersion.set(JavaLanguageVersion.of(25)) })
}
jar { manifest { attributes 'ModType': 'CRL', 'FMLAT': 'ftblib_at.cfg' }; from 'upstream-lock.json' }

// The historical runtime harness remains in verification/src for reference.
