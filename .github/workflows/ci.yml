name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Fetch and verify locked compile dependencies
        run: python3 tools/bootstrap.py
      - name: Build, test and reobfuscate all public modules
        run: bash gradlew --no-daemon :build --console=plain
      - name: Audit production jars and collect release files
        run: python3 tools/prepare_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          path: build/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            ftb-quests/build/reports/tests/
            ftb-library/build/reports/tests/
            ftb-quests/build/test-results/
            ftb-library/build/test-results/
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS dist/BUILD-INFO.json dist/RELEASE-NOTES.md \
            --verify-tag --latest --title "FTB Quests Legacy ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE-NOTES.md
